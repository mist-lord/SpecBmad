# Phase 迁移配置（冻结版规范）
# 
# 本文件定义 Phase 0-5 的迁移规则和 Gate
# Phase Controller 必须以本文件作为唯一迁移依据

phases:
  0:
    # Phase 0: Intent Capture
    # 工具: Spec-Kit
    # 产物: Intent Spec
    next: [1]
    gates: []
  
  1:
    # Phase 1: Formal Specification
    # 工具: OpenSpec
    # 产物: Formal Spec
    # Gate: OpenSpec 校验必须通过
    next: [2]
    gates:
      - openspec_passed
  
  2:
    # Phase 2: Architecture & Planning
    # 工具: BMAD (PM / Architect)
    # 产物: Plan / Architecture
    next: [3]
    gates: []
  
  3:
    # Phase 3: Implementation
    # 工具: BMAD-DEV + DeepCode
    # 产物: Code
    # Gate: DeepCode 校验必须通过
    next: [4]
    gates:
      - deepcode_passed
  
  4:
    # Phase 4: Verification
    # 工具: OpenSpec + DeepCode
    # 产物: Verification Report
    next: [5]
    gates:
      - verification_passed
  
  5:
    # Phase 5: Iteration / Evolution
    # 可以回退到 Phase 1 或 Phase 3
    next: [1, 3]
    gates: []

