name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  node:
    name: Node.js build & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6
          run_install: false
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint:gate
      - name: Type Check
        run: pnpm run type-check
      - name: Security Audit Gate
        run: pnpm run ci:security-gate
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm test
      - name: Integration pass rate (compute & gate >=90%)
        env:
          BMAD_MOCK_LLM: 1
        run: |
          pnpm run report:integration
          pnpm run ci:integration-gate
      - name: Performance smoke & gate
        env:
          BMAD_MOCK_LLM: 1
        run: |
          pnpm run benchmark:workflow
          pnpm run ci:perf-gate
      - name: Build CLI
        run: pnpm run build
      - name: CLI smoke gate (core commands & artifacts)
        env:
          BMAD_MOCK_LLM: 1
        run: |
          pnpm run ci:cli-smoke-gate
      - name: Run workflow smoke (quick)
        id: workflow_run
        env:
          BMAD_MOCK_LLM: 1
        run: |
          node dist/index.js workflow --name quick --report-dir .specbmad/workflow-smoke --date-prefix --dedupe
      - name: Gate - require workflow completion
        if: always()
        run: |
          node -e "const fs=require('fs');const candidates=['.specbmad/workflow.state.json','.bmad/workflow.state.json'];const p=candidates.find(x=>fs.existsSync(x));if(!p){console.error('Gate: no state file');process.exit(1)}const j=JSON.parse(fs.readFileSync(p));if(j.status!=='completed'){console.error('Gate: workflow not completed');process.exit(1)}const n=Array.isArray(j.completedSteps)?j.completedSteps.length:0;if(n<1){console.error('Gate: workflow completed with 0 steps');process.exit(1)}console.log('Gate: workflow completed with',n,'steps from',p)"
      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bmad-workflow-artifacts
          path: |
            .specbmad
            .bmad

  python:
    name: Python bridge smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
      - name: Run bridge tests
        working-directory: python
        run: |
          python test_bridge.py

  kpi-report:
    name: KPI sampling & artifact report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6
          run_install: false
      - name: Setup Node 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Run KPI sampling
        env:
          BMAD_MOCK_LLM: 1
        run: pnpm run report:kpi
      - name: Compute integration pass rate
        env:
          BMAD_MOCK_LLM: 1
        run: pnpm run report:integration
      - name: Generate artifact reports (MD/HTML)
        run: |
          node dist/index.js report --format markdown --output docs/最新运行报告.md
          node dist/index.js report --format html --output docs/最新运行报告.html
      - name: Upload KPI & Reports
        uses: actions/upload-artifact@v4
        with:
          name: bmad-kpi-and-reports
          path: |
            .bmad/kpi.json
            .bmad/benchmark.json
            .bmad/jest-integration.json
            docs/最新运行报告.md
            docs/最新运行报告.html
